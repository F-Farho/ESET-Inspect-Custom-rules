name: Custom Rule Submission
description: Submit a custom ESET Inspect rule for review and possible inclusion in the repository.
title: "[Rule Submission] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a custom rule.

        Please use the repository's `Template.xml` as the starting structure and provide enough context to review and test the detection safely.

  - type: input
    id: rule-name
    attributes:
      label: Rule name
      description: Use the exact name that appears inside the XML rule.
      placeholder: Example - Suspicious PowerShell Credential Access [AB1234]
    validations:
      required: true

  - type: input
    id: rule-id
    attributes:
      label: Rule ID / author identifier
      description: Include the identifier used in the rule name, if applicable.
      placeholder: Example - AB1234 or AB1234a
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Multiple / Other
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Rule category
      description: Enter the category used by the rule.
      placeholder: Example - Discovery
    validations:
      required: true

  - type: input
    id: mitre
    attributes:
      label: MITRE ATT&CK technique(s)
      description: Add one or more technique or sub-technique IDs when applicable.
      placeholder: Example - T1555.003, T1005

  - type: input
    id: severity
    attributes:
      label: Severity
      description: Enter the severity value configured in the rule.
      placeholder: Example - 60
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detection description
      description: Briefly explain what the rule detects and why the behavior matters.
    validations:
      required: true

  - type: textarea
    id: xml
    attributes:
      label: Rule XML
      description: Paste the complete, well-formatted XML rule below. You can also attach supporting files to the issue if needed.
      render: xml
      placeholder: Paste the complete XML rule here.
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: Testing and validation
      description: Describe how the rule was tested, including the ESET Inspect version when known, test activity, and whether the expected detection was generated.
      placeholder: Explain the test performed and the observed result.
    validations:
      required: true

  - type: textarea
    id: benign-causes
    attributes:
      label: Known benign causes / false positives
      description: List legitimate activity that may trigger the rule and any tuning considerations.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add references, screenshots, related detections, implementation notes, or anything else useful for review.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission checks
      options:
        - label: I used `Template.xml` as the reference structure for this submission.
          required: true
        - label: I tested this rule in a controlled environment before submitting it.
          required: true
        - label: I confirmed that the submission contains no customer data, credentials, secrets, or other sensitive information.
          required: true
